agent_safety_notes:
- Every operation returns HTTP 200, including failures. An MCP server fronting this API MUST parse body.status
  (1 success / 0 failure) rather than the HTTP status line, or it will report every error to the agent as a success.
  See rate-limits/delos-rate-limits.yml for the live evidence.
- The API offers no idempotency key. 18 of the 39 operations are writes, several of them destructive or irreversible
  from an agent's point of view (adminProductDelete, adminUserProductsDelete, localAccountTransfer, userProductInvitationRevoke,
  globalExecuteNVA). Any tool exposing these needs server-side replay protection or human confirmation.
- globalExecuteNVA dispatches a command to physical building equipment on a live installation. It is the highest-consequence
  operation in the surface and should not be exposed as an unattended agent tool.
- No rate-limit headers are returned, so an MCP server cannot back off on signal and must pace itself conservatively.
