apis:
- name: WellCube Cloud BE API
  description: >-
    REST API behind the WellCube / Darwin Cloud platform. Covers session and limited-session issuance,
    user product entitlements and product invitations, installation and product administration with
    per-installation and per-product statistics, AWS product bundles, device/system actions with
    asynchronous job polling, and local-account linking, sharing, transfer and migration to federated
    (AWS Cognito) identity. Served publicly as OpenAPI 3.0.0 through a Swagger UI at
    https://cloud.wellcube.io/api/v1/docs/; all operations require an Authorization header token.
  humanURL: https://cloud.wellcube.io/api/v1/docs/
  baseURL: https://cloud.wellcube.io/api/v1
