aid: delos
name: Delos
description: >-
  Delos Living LLC is a New York-based wellness real estate and technology company that applies building
  science and evidence-based research to indoor environments across commercial, residential, hospitality,
  education, senior living and transportation. Delos is the founder of the WELL Building Standard (now
  administered by the International WELL Building Institute) and co-founder of the Well Living Lab with
  Mayo Clinic. Its product line spans Intellipure advanced air purification, indoor environmental quality
  (IEQ) sensing, the Stay Well hospitality program, and WellCube — a connected system of localized air
  purifiers and multi-sensor devices for the modern office, backed by the "Cloud BE" / Darwin Cloud
  platform that handles installations, products, device actions and account federation.
