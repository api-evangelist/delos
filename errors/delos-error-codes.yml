  code_field: error.code
  detail_field: error.fields
  content_type: application/json
note: >-
  Delos publishes no error reference page — this catalogue is derived entirely from the OpenAPI at
  https://cloud.wellcube.io/api/v1/docs/. Two things about it are unusual enough to state plainly.

  First, the API declares NO HTTP status codes. Every one of the 39 operations has exactly one
  `default` response; every failure is declared under a NON-STANDARD response key beginning `x-`
  (`x-permission-denied`, `x-not-exists`, `x-wrong-token`, …). OpenAPI 3.0 requires response map keys
  to be HTTP status codes, ranges such as `4XX`, or `default`, so these keys are outside the
  specification. A generated client, a mock server, or an agent reading this contract cannot learn
  which HTTP status any failure returns, because the document never says.

  Second, the machine-readable error identity does exist, just one level down: fourteen reusable
  `components.responses` entries each pin a concrete `error.code` string. Those codes — listed below —
  are the real error registry a consumer should switch on, and they are what makes this contract
  usable despite the response-key problem.
error_codes:
