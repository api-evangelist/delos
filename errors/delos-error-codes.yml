field_level_codes:
  note: >-
    `error.fields` is a free-form object on most components, but the three session operations declare
    its shape inline with per-field verdict strings.
  observed:
  - {field: email, values: [INVALID]}
  - {field: password, values: [INVALID]}
  - {field: status, values: [NOT_ACTIVE_USER]}
  - {field: token, values: [EXPIRED]}
observed_live:
  method: probed
  date: '2026-08-12'
  note: >-
    Two unauthenticated probes against the live API returned error codes and an envelope field that
    the OpenAPI does not document. Recorded here as observed fact, not merged into the derived
    registry above.
  observations:
  - request: GET https://cloud.wellcube.io/api/v1/products
    http_status: 200
    body: '{"status":0,"error":{"fields":{"token":"REQUIRED"},"code":"FORMAT_ERROR"}}'
    findings:
    - '`FORMAT_ERROR` is returned for a missing Authorization token. It appears in NO components.responses entry and in no operation''s response map — an undocumented error code on the most common failure any consumer will hit.'
    - '`fields.token: REQUIRED` is an undocumented field verdict.'
  - request: POST https://cloud.wellcube.io/api/v1/sessions (invalid credentials)
    http_status: 200
    body: '{"status":0,"error":{"code":"AUTHENTICATION_FAILED","message":"Authentication failed","fields":{"code":"AUTHENTICATION_FAILED","email":"INVALID","password":"INVALID"}}}'
    findings:
    - The live envelope carries an `error.message` string that the OpenAPI never declares — every documented error component declares only `code` and `fields`.
    - '`error.fields` echoes `code` back inside itself, which the spec does not model.'
    - HTTP 200 on an authentication failure, confirming the status-flag contract in production.
spec_defects:
- id: non-http-response-keys
  severity: high
  detail: >-
    All 19 failure response keys are `x-`-prefixed strings rather than HTTP status codes. No operation
    declares a 2xx, 4xx or 5xx response. Tooling that keys off status codes (generators, mocks,
    contract tests, agent runtimes) gets nothing.
- id: mis-referenced-component
  severity: medium
  detail: >-
    `localAccountSetGlobal` declares its `x-permission-denied` response as
    `InstallationWrongCredentialsError` (code INSTALLATION_WRONG_CREDENTIALS) while the other 27
    operations using that same key reference `PermissionDeniedError` (code PERMISSION_DENIED). One of
    the two is wrong; a consumer cannot tell which from the document alone.
- id: misspelled-key
  severity: low
  detail: '`x-authentification-failed` — the response key is misspelled (authentification/authentication).'
- id: undocumented-error-code
  severity: high
  detail: >-
    The live API returns `FORMAT_ERROR` for a missing/invalid Authorization token — the single most
    common failure mode — and that code exists nowhere in the published contract. It also returns an
    `error.message` field the schema does not declare.
- id: undocumented-remediation
  severity: medium
  detail: >-
    No component carries remediation guidance, retry advice, or a documentation link. Titles are
    single-phrase and several are slugs rather than sentences ("permission-denied", "wrong-id").
