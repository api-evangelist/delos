- id: openapi-response-keys
  conforms: false
  evidence: >-
    OpenAPI 3.0 requires responses map keys to be an HTTP status code, a range (`4XX`), or `default`.
    All 19 failure keys in this document are `x-`-prefixed strings. Structurally the document loads in
    Swagger UI, but the response map is not conformant.
- id: rfc9457-problem-details
