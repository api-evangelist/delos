- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme in the OpenAPI. The API mints its own tokens through
    POST /sessions and POST /limited-sessions and accepts them as an `Authorization` apiKey header.
- id: oidc
  conforms: partial
  evidence: >-
    The WellCube web application federates to an AWS Cognito user pool
    (us-east-1_QNxQ6AqaQ) whose OIDC discovery document and JWKS both return 200. The Cloud BE API
    itself does not declare an openIdConnect securityScheme; it exposes Cognito only through two
    admin-scoped session-exchange operations.
