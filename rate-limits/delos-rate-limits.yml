note: >-
  Delos publishes no rate limits for the Cloud BE API — there is no developer documentation beyond the
  Swagger UI, and the OpenAPI declares no throttling response. limit_count is an honest zero.

  Two live unauthenticated requests were made (a list read and a deliberately-failing login with an
  invalid @example.invalid address) and neither response carried any `X-RateLimit-*`, `RateLimit-*` or
  `Retry-After` header. The only headers returned are CORS, caching and `x-powered-by: Express`.

  Because throttling is neither documented nor signalled in headers, a client has no way to back off
  correctly. This compounds the absence of an idempotency contract (see
  conventions/delos-conventions.yml): a caller that is throttled cannot detect it from a header and
  cannot safely retry the 18 write operations.
observed_runtime_behaviour:
  http_status_always_200: true
  detail: >-
    Both probes returned HTTP 200 even on failure. The unauthenticated read returned
    `{"status":0,"error":{"fields":{"token":"REQUIRED"},"code":"FORMAT_ERROR"}}` and the bad-credential
    login returned `{"status":0,"error":{"code":"AUTHENTICATION_FAILED",...}}` — both with a 200 status
    line. This confirms in production what the OpenAPI implies by declaring no HTTP status codes: the
    body `status` flag is the ONLY outcome signal. Any agent, proxy, retry library or monitor that
    keys on HTTP status will read every failure as a success.
